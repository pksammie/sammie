<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SamBlog | Admin Panel</title>
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="admin-container">
        <h1>Admin Control Center</h1>
        
        <div class="admin-card">
            <h3>Update Global Alert</h3>
            <textarea id="alert-text" placeholder="Type an announcement..."></textarea>
            <button class="btn dark" onclick="updateAlert()">Post Alert</button>
            <button class="btn danger" onclick="clearAlert()">Clear Alert</button>
        </div>

        <div class="admin-card">
            <h3>Registered Users</h3>
            <div id="user-list">Loading users...</div>
        </div>
    </div>

    <!-- FIXED: Using your local files so it doesn't fail -->
    <script src="/js/firebase-app.js"></script>
    <script src="/js/firebase-firestore.js"></script>
    <script src="/js/firebase-auth.js"></script>
    <script src="/js/firebase.js"></script>

    <script>
        auth.onAuthStateChanged(user => {
    if (user) {
        user.getIdTokenResult(true).then(idTokenResult => {
            if (idTokenResult.claims.admin) {
                fetchUsers();
            } else {
                alert("Access Denied");
                location.replace("/");
            }
        });
    } else {
        location.replace("/dashboard.html");
    }
});

// Use the window object to make sure HTML buttons can always find these
window.updateAlert = () => {
    const text = document.getElementById('alert-text').value;
    if(!text) return alert("Please type something first!");
    
    db.collection("announcements").doc("current").set({
        text: text,
        active: true
    }).then(() => alert("Alert Updated!"))
    .catch(err => alert("Error: " + err.message));
}

window.clearAlert = () => {
    db.collection("announcements").doc("current").update({ active: false })
    .then(() => alert("Alert Cleared!"));
}

function fetchUsers() {
    fetch('/admin/get-users').then(res => res.json()).then(users => {
        const container = document.getElementById('user-list');
        container.innerHTML = users.map(u => `
            <div class="user-item">
                <span>${u.email}</span>
                <button class="btn-sm danger" onclick="deleteUser('${u.uid}')">Remove</button>
            </div>
        `).join('');
    });
}

window.deleteUser = (uid) => {
    if(confirm("Are you sure?")){
        fetch('/admin/delete-user', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ targetUid: uid, adminUid: auth.currentUser.uid })
        }).then(() => fetchUsers());
    }
}
    </script>
</body>
</html>
