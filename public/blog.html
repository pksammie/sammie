<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog :</title>
    <link rel="stylesheet" href="/css/home.css" />
    <link rel="stylesheet" href="/css/editor.css" />
    <link rel="stylesheet" href="/css/blog.css" />
</head>
<body>
    <nav class="navbar">
        <img src="/img/Untitled.png" class="logo" alt="" />
        <ul class="links-container">
            <li class="link-item"><a href="/" class="link">Home</a></li>
            <li class="link-item"><a href="/editor" class="link">Editor</a></li>
            <li class="link-item"><a href="/testimonial.html" class="link">Testimonial</a></li>
        </ul>
    </nav>

    <div class="banner"></div>

    <div class="blog">
        <h1 class="title"></h1>
        <p class="published"><span>published at - </span></p>
        <a href="" class="btn" id="edit-blog-btn">edit blog</a>
        <div class="article"></div>
    </div>

    <div class="comment-section" id="comment-section">
        <h2 class="comment-title">Comments</h2>
        <div class="comments-container"></div>
        <div class="comment-input-group">
            <textarea id="comment-input" placeholder="Add a comment..."></textarea>
            <button class="btn dark" id="add-comment-btn">Post</button>
        </div>
    </div>

    <h1 class="sub-heading">Check other blogs</h1>
    <section class="blogs-section"></section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-auth.js"></script>

    <!-- FIXED: Added / before js -->
    <script src="/js/firebase.js"></script>
    <script src="/js/blog.js"></script>
    <script src="/js/home.js"></script>
    <script src="/js/nav.js"></script>
</body>
</html>
